<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Store</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:#f4f6f8;
  color:#111;
  overflow-x:hidden;
}

/* 🌈 soft background (fixed brightness) */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(120,160,255,0.10), transparent 55%),
    radial-gradient(circle at 20% 20%, rgba(255,180,220,0.08), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(120,255,200,0.06), transparent 50%),
    linear-gradient(135deg,#f4f6f8,#e9eef5);
  filter:blur(65px);
  z-index:0;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position:relative;
  z-index:2;
  text-align:center;
}

.glass-title{
  font-size:44px;
  letter-spacing:3px;
  padding:18px 40px;
  border-radius:20px;
  background:rgba(255,255,255,0.5);
  border:1px solid rgba(255,255,255,0.7);
  backdrop-filter:blur(20px);
  box-shadow:0 10px 40px rgba(0,0,0,0.08);
}

.scroll-hint{
  margin-top:15px;
  font-size:12px;
  opacity:0.6;
  animation:bounce 1.5s infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(5px);}
}

/* section */
section{
  padding:80px 20px;
}

/* title */
.center-title{
  text-align:center;
  font-size:18px;
  letter-spacing:5px;
  margin-bottom:30px;
  opacity:0.7;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

/* cards */
.card{
  background:rgba(255,255,255,0.7);
  border:1px solid rgba(0,0,0,0.05);
  border-radius:14px;
  padding:16px;
  transition:0.3s;
  position:relative;
}

.card:hover{
  transform:translateY(-5px);
  background:rgba(255,255,255,0.9);
}

/* premium */
.card.premium{
  border:1px solid rgba(255,215,0,0.5);
}

/* discount ONLY last user */
.discount{
  position:absolute;
  top:10px;
  right:10px;
  font-size:11px;
  background:rgba(255,215,0,0.2);
  padding:5px 10px;
  border-radius:20px;
  color:#b8860b;
  font-weight:600;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* button */
button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#111;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#333;
}

/* about */
.about-text{
  max-width:800px;
  margin:60px auto 20px auto;
  text-align:center;
  font-size:13px;
  line-height:1.8;
  opacity:0.7;
  padding:0 20px;
}

/* 💳 payments */
.payments{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:30px 0 60px 0;
  opacity:0.85;
}

.payments img{
  width:55px;
  height:auto;
  filter:grayscale(100%);
  transition:0.3s;
}

.payments img:hover{
  filter:grayscale(0%);
  transform:scale(1.1);
}

/* footer */
footer{
  text-align:center;
  padding:30px;
  font-size:12px;
  opacity:0.5;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- HERO -->
<div class="hero">
  <div class="glass-title">ALI STORE</div>
  <div class="scroll-hint">Scroll down</div>
</div>

<!-- USERS -->
<section>

<div class="center-title">INSTAGRAM USERS</div>

<div class="grid">

<div class="card"><h3>sj76</h3><p>$35</p><button onclick="buy('sj76',35)">Buy</button></div>
<div class="card"><h3>lpi0</h3><p>$35</p><button onclick="buy('lpi0',35)">Buy</button></div>
<div class="card"><h3>iugs</h3><p>$35</p><button onclick="buy('iugs',35)">Buy</button></div>
<div class="card"><h3>fdd3</h3><p>$55</p><button onclick="buy('fdd3',55)">Buy</button></div>
<div class="card"><h3>1ouu</h3><p>$63</p><button onclick="buy('1ouu',63)">Buy</button></div>
<div class="card"><h3>f.u3</h3><p>$75</p><button onclick="buy('f.u3',75)">Buy</button></div>
<div class="card"><h3>gg.0</h3><p>$130</p><button onclick="buy('gg.0',130)">Buy</button></div>

<!-- 💎 PREMIUM ONLY LAST -->
<div class="card premium">
  <div class="discount">-30% OFF</div>
  <h3>r.cc</h3>
  <p>$220</p>
  <button onclick="buy('r.cc',220)">Buy</button>
</div>

</div>
</section>

<!-- ABOUT -->
<div class="about-text">
علي ستور هو أفضل ستور لبيع وشراء حسابات مواقع التواصل الاجتماعي بسهولة تامة وأمان عالي والمسجلة في وزارة التجارة العراقية
</div>

<!-- PAYMENTS (UPDATED VISA) -->
<div class="payments">
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Visa.svg" alt="visa">
  <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="mastercard">
  <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="paypal">
</div>

<footer>© Ali Store - All rights reserved</footer>

<script>

function buy(n,p){
  window.location.href =
  "https://t.me/master3lii?text=" +
  encodeURIComponent(`I want to buy ${n} - $${p}`);
}

/* soft background interaction */
document.addEventListener("mousemove",(e)=>{
  let x = (e.clientX / window.innerWidth) * 100;
  let y = (e.clientY / window.innerHeight) * 100;

  document.documentElement.style.setProperty("--x", x+"%");
  document.documentElement.style.setProperty("--y", y+"%");
});

</script>

</body>
</html>
