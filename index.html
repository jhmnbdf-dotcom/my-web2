<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>

<style>

@font-face {
  font-family: 'Milligram';
  src: url('alfont_com_Milligram-Arabic-Extrabold-TRIAL.ttf');
}

body {
  margin: 0;
  font-family: 'Milligram', Arial;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  background: #000;
}

/* خلفية نقاط */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  width: 90%;
  max-width: 360px;
  padding: 30px;
  border-radius: 22px;

  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  text-align: center;

  animation: pop 1s ease;
}

@keyframes pop {
  from {transform: scale(0.8); opacity: 0;}
  to {transform: scale(1); opacity: 1;}
}

h1 {
  margin-bottom: 25px;
}

.link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  margin: 12px 0;
  padding: 15px;
  border-radius: 14px;
  text-decoration: none;
  color: white;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  transition: 0.3s;
}

.link:hover {
  transform: scale(1.08);
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 25px rgba(255,255,255,0.3);
}

.icon {
  width: 24px;
}

/* رسالة تشغيل */
#msg {
  position: fixed;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  opacity: 0.7;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- 🎵 الموسيقى -->
<audio id="bgmusic" loop>
  <source src="music.mp4" type="audio/mp4">
</audio>

<div class="card">

  <h1>اهلا بك يا مطي </h1>

  <a class="link" href="https://t.me/master3lii" target="_blank">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">
    تيليجرام
  </a>

  <a class="link" href="#">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
    انستغرام
  </a>

  <a class="link" href="#">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
    واتساب
  </a>

</div>

<div id="msg">اضغط في أي مكان لتشغيل الموسيقى 🎵</div>

<script>

/* 🎵 تشغيل الموسيقى بعد أول ضغط */
document.body.addEventListener("click", function () {
  const audio = document.getElementById("bgmusic");
  audio.play();
  document.getElementById("msg").style.display = "none";
}, { once: true });

/* ✨ particles */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2,
    dx: (Math.random()-0.5),
    dy: (Math.random()-0.5)
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "white";

  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
  });

  requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
